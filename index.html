<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nathan × Charlotte：抽卡物语</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="stage">
        <div id="cardContainer" class="card-container">
            <div id="hint" class="swipe-hint">向右滑动翻面 >>></div>
            
            <div class="card-face card-back"></div>
            
            <div class="card-face card-front">
                <div class="card-img-wrapper">
                    <img id="cardImage" class="card-img" src="" alt="card image">
                </div>
                <div class="card-content">
                    <div class="card-header">
                        <span id="cardName" class="card-name">名称</span>
                        <span id="cardBadge" class="card-rarity"></span>
                    </div>
                    <div id="cardDesc" class="card-body">描述载入中...</div>
                </div>
            </div>
        </div>
    </div>

    <button id="drawBtn" class="draw-btn" onclick="prepareCard()">正在加载物语...</button>

    <script src="script.js"></script>
    <script src="hr-effect.js"></script>
    <script src="ur-effect.js"></script>

    <script src="script.js"></script> 
</body>
</html>
