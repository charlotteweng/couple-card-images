<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PONY TCG POCKET</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --ur: #ff4500; --hr: #ff8c00; --ssr: #ffd700; --sr: #a020f0; --r: #1e90ff; --n: #777; 
            --bg-color: #e0f2fe; 
        }
        
        body { 
            background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
            color: #334155; font-family: -apple-system, sans-serif; 
            margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh; touch-action: none; 
        }
        
        .stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; }

        .swipe-hint {
            position: absolute; top: -50px; width: 100%; text-align: center;
            color: #0369a1; font-weight: bold; font-size: 18px;
            animation: bounce 2s infinite; pointer-events: none;
        }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }

        #packContainer {
            width: 280px; height: 440px; 
            background-image: url('https://raw.githubusercontent.com/charlotteweng/couple-card-images/main/Package%20Cover.png');
            background-size: cover; background-position: center; border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            cursor: pointer; display: none; position: relative; z-index: 10;
            border: 4px solid #fff;
        }

        /* --- 修正后的卡片布局 --- */
        .card {
            width: 320px; height: 480px; background: #fff; border-radius: 16px;
            border: 6px solid #fff; position: absolute; display: none;
            box-shadow: 0 15px 50px rgba(0,0,0,0.15); color: #1e293b;
            z-index: 20; overflow: hidden; transform: scale(0);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card.reveal { display: block; transform: scale(1); }

        /* 5:4 比例容器：核心修复点 */
        .card-img-wrapper {
            width: 284px; /* 留一点边距 */
            margin: 15px auto 10px;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: #eee;
            /* 下面这两行强制锁定 5:4 比例 (高度 = 宽度 * 0.8) */
            height: 0;
            padding-top: 227.2px; /* 284 * 0.8 */
        }

        .card-img { 
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%; 
            object-fit: cover; /* 自动填充并居中，不会拉伸 */
            object-position: center;
        }

        .card-content { padding: 0 18px; }
        .card-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding-bottom: 5px; border-bottom: 2px solid #f1f5f9; 
        }
        .card-name { font-size: 19px; font-weight: 800; color: #0f172a; }
        .card-rarity { font-style: italic; font-weight: 900; font-size: 24px; }
        
        .card-body { 
            margin-top: 10px; font-size: 14px; color: #64748b; 
            line-height: 1.5; height: 100px; overflow-y: auto; 
        }

        .draw-btn { 
            margin-bottom: 60px; background: #0ea5e9; color: white; border: none; 
            padding: 16px 50px; font-size: 18px; font-weight: bold; border-radius: 50px; 
            cursor: pointer; z-index: 100; box-shadow: 0 4px 0 #0284c7;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div id="packContainer">
            <div class="swipe-hint">向右滑动撕开卡包 >>></div>
            <div class="holo"></div>
        </div>

        <div id="card" class="card">
            <div class="card-img-wrapper">
                <img id="cardImage" class="card-img" src="" alt="card image">
            </div>
            <div class="card-content">
                <div class="card-header">
                    <span id="cardName" class="card-name">名称</span>
                    <span id="cardBadge" class="card-rarity"></span>
                </div>
                <div id="cardDesc" class="card-body">描述载入中...</div>
            </div>
        </div>
    </div>

    <button id="drawBtn" class="draw-btn" onclick="showPack()">加载数据中...</button>

    <script>
        let cardPool = [];
        
        async function loadCSV() {
            try {
                const r = await fetch('cards.csv?v=' + Date.now());
                const t = await r.text();
                const rows = t.trim().split('\n').filter(line => line.includes(','));
                cardPool = rows.slice(1).map(row => {
                    const c = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return { id: c[0], name: c[1], rarity: c[2], desc: c[3], img: c[4].trim() };
                });
                document.getElementById('drawBtn').innerText = "提取记忆卡包";
            } catch(e) { 
                document.getElementById('drawBtn').innerText = "数据载入失败";
            }
        }

        function showPack() {
            document.getElementById('drawBtn').style.display = 'none';
            document.getElementById('card').classList.remove('reveal');
            const pack = document.getElementById('packContainer');
            pack.style.display = 'block';
            pack.style.opacity = '1';
            pack.style.transform = 'scale(1)';
        }

        let startX = 0;
        const pack = document.getElementById('packContainer');
        
        const onStart = (x) => startX = x;
        const onEnd = (x) => {
            if (x - startX > 60) {
                pack.style.transition = '0.4s ease-in';
                pack.style.transform = 'translateX(300px) rotate(30deg) scale(0.7)';
                pack.style.opacity = '0';
                setTimeout(() => {
                    pack.style.display = 'none';
                    renderCard();
                }, 400);
            }
        };

        pack.addEventListener('touchstart', e => onStart(e.touches[0].clientX));
        pack.addEventListener('touchend', e => onEnd(e.changedTouches[0].clientX));
        pack.addEventListener('mousedown', e => onStart(e.clientX));
        pack.addEventListener('mouseup', e => onEnd(e.clientX));

        function renderCard() {
            const res = cardPool[Math.floor(Math.random() * cardPool.length)];
            document.getElementById('cardImage').src = res.img;
            document.getElementById('cardName').innerText = res.name;
            document.getElementById('cardDesc').innerText = res.desc;
            const b = document.getElementById('cardBadge');
            b.innerText = res.rarity;
            b.style.color = `var(--${res.rarity.toLowerCase()})`;

            const cardEl = document.getElementById('card');
            cardEl.classList.add('reveal');
            
            if(['UR','HR','SSR'].includes(res.rarity)) {
                confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } });
            }

            setTimeout(() => {
                const btn = document.getElementById('drawBtn');
                btn.style.display = 'block';
                btn.innerText = "再抽一包";
            }, 1500);
        }

        loadCSV();
    </script>
</body>
</html>
