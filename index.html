<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小马的闪光图鉴</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --ur: #ff4500; --hr: #ff8c00; --ssr: #ffd700; --sr: #a020f0; --r: #1e90ff; --n: #8b8b8b; }
        body { background: #0a0a0a; color: white; font-family: sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        
        /* 顶部状态 */
        .header { background: #e3350d; width: 100%; text-align: center; padding: 10px 0; border-bottom: 4px solid #333; z-index: 100; }

        /* 游戏舞台 */
        .stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; perspective: 1000px; }

        /* 卡包样式 */
        .booster-pack {
            width: 320px; height: 180px; background: #e3350d; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); cursor: pointer;
            position: absolute; z-index: 50; border: 4px solid #fff;
            transition: transform 0.3s; transform-style: preserve-3d;
        }
        .booster-pack::after { content: "SWIPE RIGHT >>>"; color: #fff; font-weight: bold; font-size: 20px; animation: blink 1s infinite; }
        
        /* 撕开动画效果 */
        .pack-tear { animation: tearOut 0.8s forwards; }
        @keyframes tearOut {
            0% { transform: scale(1) rotate(0); }
            50% { transform: scale(1.1) rotate(5deg); filter: brightness(2); }
            100% { transform: scale(0) rotate(-20deg); opacity: 0; }
        }

        /* 横向卡片样式 (5:4 比例) */
        .card {
            width: 350px; height: 280px; background: #333; border-radius: 12px;
            border: 6px solid #fff; position: relative; display: none;
            box-shadow: 0 0 40px rgba(255,255,255,0.2);
            overflow: hidden; animation: cardPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes cardPop {
            0% { transform: scale(0) rotate(-10deg); }
            100% { transform: scale(1) rotate(0); }
        }

        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .rarity-badge { position: absolute; top: 10px; right: 15px; font-size: 36px; font-weight: 900; text-shadow: 2px 2px 0 #000; font-style: italic; }

        /* 按钮 */
        .draw-btn { margin-bottom: 40px; background: #ffcc00; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 30px; box-shadow: 0 5px 0 #b89600; cursor: pointer; }
        .draw-btn:disabled { background: #555; box-shadow: none; opacity: 0.5; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div class="header">
        <h2 style="margin:0;">PONY TCG</h2>
        <div id="counter" style="font-size:12px;">正在初始化卡包...</div>
    </div>

    <div class="stage">
        <div id="pack" class="booster-pack" style="display:none;"></div>
        <div id="card" class="card">
            <img id="cardImage" class="card-img" src="">
            <div id="badge" class="rarity-badge"></div>
        </div>
    </div>

    <div id="info" style="margin-bottom:10px; text-align:center; min-height:40px;">
        <h3 id="cardName" style="margin:0; color:#ffcc00;"></h3>
    </div>

    <button id="drawBtn" class="draw-btn" onclick="preparePack()">抽一张卡！</button>

    <script>
        let cardPool = [];
        let startX = 0;

        // 初始化加载 CSV
        async function init() {
            try {
                const response = await fetch('cards.csv');
                const text = await response.text();
                const rows = text.split('\n').filter(r => r.trim() !== '');
                cardPool = rows.slice(1).map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return { id: cols[0].trim(), name: cols[1].trim(), rarity: cols[2].trim(), desc: cols[3].trim(), img: cols[4].trim() };
                });
                document.getElementById('counter').innerText = `图鉴剩余: ${cardPool.length} 张`;
            } catch (e) { alert("CSV加载失败，请检查文件"); }
        }

        // 1. 点击按钮，卡包出现
        function preparePack() {
            document.getElementById('drawBtn').disabled = true;
            document.getElementById('card').style.display = 'none';
            document.getElementById('cardName').innerText = "";
            
            const pack = document.getElementById('pack');
            pack.style.display = 'flex';
            pack.className = 'booster-pack'; // 重置动画
        }

        // 2. 滑动交互逻辑
        const packEl = document.getElementById('pack');
        packEl.addEventListener('touchstart', e => startX = e.touches[0].clientX);
        packEl.addEventListener('mousedown', e => startX = e.clientX);

        packEl.addEventListener('touchend', e => handleSwipe(e.changedTouches[0].clientX));
        packEl.addEventListener('mouseup', e => handleSwipe(e.clientX));

        function handleSwipe(endX) {
            if (endX - startX > 50) { // 向右滑动超过50px
                tearPack();
            }
        }

        // 3. 撕开动画并展示卡片
        function tearPack() {
            const pack = document.getElementById('pack');
            pack.classList.add('pack-tear');

            setTimeout(() => {
                pack.style.display = 'none';
                showCard();
            }, 800);
        }

        function showCard() {
            const res = cardPool[Math.floor(Math.random() * cardPool.length)];
            const cardBox = document.getElementById('card');
            
            document.getElementById('cardImage').src = res.img;
            document.getElementById('badge').innerText = res.rarity;
            document.getElementById('badge').style.color = `var(--${res.rarity.toLowerCase()})`;
            document.getElementById('cardName').innerText = `【${res.rarity}】${res.name}`;
            
            cardBox.style.display = 'block';

            // 稀有度特殊效果
            if(['UR','HR','SSR'].includes(res.rarity)) {
                confetti({ particleCount: 200, spread: 90, origin: { y: 0.5 } });
            }

            document.getElementById('drawBtn').disabled = false;
        }

        init();
    </script>
</body>
</html>
