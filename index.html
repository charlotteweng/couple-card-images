        :root { --ur: #ff4500; --ssr: #ffd700; --sr: #a020f0; --r: #1e90ff; --n: #8b8b8b; }
        body { background: #121212; color: white; font-family: -apple-system, sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        
        .stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; perspective: 1500px; position: relative; }

        /* 卡包容器：纵向比例 */
        .pack-wrapper {
            width: 260px; height: 400px; position: relative; cursor: grab;
            transform-style: preserve-3d; z-index: 50;
        }

        /* 镭射层 */
        .holographic {
            position: absolute; inset: 0; z-index: 10; pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0) 20%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 80%);
            background-size: 200% 200%; mix-blend-mode: overlay; opacity: 0.5; border-radius: 15px;
        }

        /* 卡包半边：左和右 */
        .pack-half {
            position: absolute; top: 0; height: 100%; width: 50%;
            background-image: url('https://raw.githubusercontent.com/charlotteweng/couple-card-images/main/Package%20Cover.png');
            background-size: 260px 400px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .pack-left { left: 0; background-position: left; border-radius: 15px 0 0 15px; }
        .pack-right { right: 0; background-position: right; border-radius: 0 15px 15px 0; transform-origin: left center; }

        }
