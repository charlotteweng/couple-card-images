<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nathan × Charlotte：抽卡物语</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --ur: #ff4500; --hr: #ff8c00; --ssr: #ffd700; --sr: #a020f0; --r: #1e90ff; --n: #777; 
        }
        
        body { 
            background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
            color: #334155; font-family: -apple-system, "PingFang SC", sans-serif; 
            margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh; touch-action: none; 
        }
        
        .stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; perspective: 1200px; }

        .swipe-hint {
            position: absolute; top: -60px; width: 100%; text-align: center;
            color: #0369a1; font-weight: bold; font-size: 18px;
            animation: bounce 2s infinite; opacity: 0; transition: 0.3s;
        }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }

        /* 3D 翻转容器 */
        .card-container {
            width: 320px; height: 480px; position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none; cursor: pointer;
        }
        .card-container.is-flipped { transform: rotateY(180deg); }
        .card-container.show { display: block; animation: popIn 0.5s ease-out; }
        @keyframes popIn { from { transform: scale(0) rotate(-5deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 18px;
            border: 6px solid #fff; box-shadow: 0 15px 50px rgba(0,0,0,0.12);
            overflow: hidden; background: #fff;
        }

        /* 卡片背面 */
        .card-back {
            background-image: url('https://raw.githubusercontent.com/charlotteweng/couple-card-images/main/Package%20Cover.png');
            background-size: cover; background-position: center;
            z-index: 2;
        }
        .card-back::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, transparent 20%, rgba(255,255,255,0.2) 50%, transparent 80%);
            mix-blend-mode: overlay;
        }

        /* 卡片正面 */
        .card-front {
            transform: rotateY(180deg);
            z-index: 1; color: #1e293b;
        }

        /* 5:4 比例图片 */
        .card-img-wrapper {
            width: 284px; height: 0; padding-top: 227.2px; 
            margin: 15px auto 10px; position: relative;
            border-radius: 8px; overflow: hidden; background: #f8fafc;
        }
        .card-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .card-content { padding: 0 18px; text-align: left; }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 5px; }
        .card-name { font-size: 19px; font-weight: 800; }
        .card-rarity { font-style: italic; font-weight: 900; font-size: 24px; }
        .card-body { margin-top: 10px; font-size: 14px; color: #64748b; line-height: 1.5; height: 110px; overflow-y: auto; }

        .draw-btn { 
            margin-bottom: 60px; background: #0ea5e9; color: white; border: none; 
            padding: 16px 50px; font-size: 18px; font-weight: bold; border-radius: 50px; 
            cursor: pointer; z-index: 100; box-shadow: 0 4px 0 #0284c7; transition: 0.2s;
        }
        .draw-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #0284c7; }
    </style>
</head>
<body>

    <div class="stage">
        <div id="cardContainer" class="card-container">
            <div id="hint" class="swipe-hint">向右滑动翻面 >>></div>
            <div class="card-face card-back"></div>
            <div class="card-face card-front">
                <div class="card-img-wrapper">
                    <img id="cardImage" class="card-img" src="" alt="card image">
                </div>
                <div class="card-content">
                    <div class="card-header">
                        <span id="cardName" class="card-name">名称</span>
                        <span id="cardBadge" class="card-rarity"></span>
                    </div>
                    <div id="cardDesc" class="card-body">描述载入中...</div>
                </div>
            </div>
        </div>
    </div>

    <button id="drawBtn" class="draw-btn" onclick="prepareCard()">加载物语中...</button>

    <script>
        let cardPool = [];
        let isFlipped = false;
        
        async function loadCSV() {
            try {
                const r = await fetch('cards.csv?v=' + Date.now());
                const t = await r.text();
                const rows = t.trim().split('\n').filter(line => line.includes(','));
                cardPool = rows.slice(1).map(row => {
                    const c = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return { id: c[0], name: c[1], rarity: c[2], desc: c[3], img: c[4].trim() };
                });
                document.getElementById('drawBtn').innerText = "抽一张卡";
            } catch(e) { document.getElementById('drawBtn').innerText = "载入失败"; }
        }

        function prepareCard() {
            isFlipped = false;
            document.getElementById('drawBtn').style.display = 'none';
            const container = document.getElementById('cardContainer');
            container.classList.remove('is-flipped');
            
            const res = cardPool[Math.floor(Math.random() * cardPool.length)];
            document.getElementById('cardImage').src = res.img;
            document.getElementById('cardName').innerText = res.name;
            document.getElementById('cardDesc').innerText = res.desc;
            const b = document.getElementById('cardBadge');
            b.innerText = res.rarity;
            b.style.color = `var(--${res.rarity.toLowerCase()})`;
            
            container.classList.add('show');
            setTimeout(() => { document.getElementById('hint').style.opacity = '1'; }, 600);
        }

        let startX = 0;
        const container = document.getElementById('cardContainer');
        const onStart = (x) => startX = x;
        const onEnd = (x) => {
            if (isFlipped) return;
            if (x - startX > 50) {
                isFlipped = true;
                container.classList.add('is-flipped');
                document.getElementById('hint').style.opacity = '0';
                
                const rarity = document.getElementById('cardBadge').innerText;
                if(['UR','HR','SSR'].includes(rarity)) {
                    setTimeout(() => {
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                    }, 400);
                }
                
                setTimeout(() => {
                    const btn = document.getElementById('drawBtn');
                    // 4. 后续按钮文案升级
                    btn.innerText = "继续抽卡";
                    btn.style.display = 'block';
                }, 1200);
            }
        };

        container.addEventListener('touchstart', e => onStart(e.touches[0].clientX));
        container.addEventListener('touchend', e => onEnd(e.changedTouches[0].clientX));
        container.addEventListener('mousedown', e => onStart(e.clientX));
        container.addEventListener('mouseup', e => onEnd(e.clientX));

        loadCSV();
    </script>
</body>
</html>
