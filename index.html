<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小马的闪光图鉴</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --ur: #ff4500; --hr: #ff8c00; --ssr: #ffd700; --sr: #a020f0; --r: #1e90ff; --n: #8b8b8b; }
        body { background: #1a1a1a; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .pokedex-bg { background: #e3350d; width: 100%; text-align: center; padding: 15px 0; border-bottom: 6px solid #b32100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); position: sticky; top: 0; z-index: 100; }
        .card-container { margin-top: 30px; perspective: 1000px; }
        .card { width: 280px; height: 400px; border-radius: 15px; border: 8px solid #fff; background: #333; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; transition: 0.6s; transform-style: preserve-3d; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .rarity-badge { position: absolute; top: 10px; right: 15px; font-size: 32px; font-weight: 900; text-shadow: 2px 2px 0 #000; font-style: italic; }
        .draw-btn { margin: 25px 0; background: #ffcc00; color: #333; border: none; padding: 15px 60px; font-size: 20px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 0 #b89600; }
        .info-box { padding: 15px; background: #222; border-radius: 12px; width: 85%; max-width: 320px; border: 1px solid #444; min-height: 100px; }
    </style>
</head>
<body>
    <div class="pokedex-bg">
        <h2 style="margin:0; letter-spacing: 2px;">PONY INDEX</h2>
        <div id="counter" style="font-size:12px; margin-top:5px;">加载中...</div>
    </div>
    <div class="card-container">
        <div id="card" class="card">
            <img id="cardImage" class="card-img" src="https://raw.githubusercontent.com/charlotteweng/couple-card-images/main/back.png">
            <div id="badge" class="rarity-badge"></div>
        </div>
    </div>
    <div class="info-box">
        <h3 id="cardName" style="margin:0 0 8px 0; color: #ffcc00;">???</h3>
        <p id="cardDesc" style="font-size:14px; color:#ddd; margin:0; line-height:1.4;">点击下方按钮提取瞬间...</p>
    </div>
    <button class="draw-btn" onclick="draw()">提取记忆</button>

    <script>
        let cards = [];
        // 自动从你的 cards.csv 获取数据
        async function loadData() {
            const response = await fetch('https://raw.githubusercontent.com/charlotteweng/couple-card-images/main/cards.csv');
            const data = await response.text();
            const lines = data.split('\n').filter(line => line.trim() !== '');
            cards = lines.slice(1).map(line => {
                const parts = line.split(',');
                return { id: parts[0], name: parts[1], rarity: parts[2], desc: parts[3], img: parts[4].trim() };
            });
            document.getElementById('counter').innerText = `已载入 ${cards.length} 份闪光记忆`;
        }

        function draw() {
            if (cards.length === 0) return;
            const btn = document.querySelector('.draw-btn');
            btn.disabled = true;
            const cardBox = document.getElementById('card');
            cardBox.style.transform = "scale(0.8) rotateY(720deg)";
            
            setTimeout(() => {
                const res = cards[Math.floor(Math.random() * cards.length)];
                document.getElementById('cardImage').src = res.img;
                document.getElementById('badge').innerText = res.rarity;
                document.getElementById('badge').style.color = `var(--${res.rarity.toLowerCase()})`;
                document.getElementById('cardName').innerText = res.name;
                document.getElementById('cardDesc').innerText = res.desc;
                cardBox.style.transform = "scale(1) rotateY(0deg)";
                if(['UR','HR','SSR'].includes(res.rarity)) confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                btn.disabled = false;
            }, 600);
        }
        loadData();
    </script>
</body>
</html>
